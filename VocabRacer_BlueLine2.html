<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏎️ Vocab Racer – Blue Line 2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: white;
  overflow-x: hidden;
}

/* ── HOME SCREEN ── */
#home {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100vh; padding: 20px; text-align: center;
}
#home h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin-bottom: 8px; text-shadow: 0 0 20px #f39c12; }
#home p  { font-size: clamp(0.9rem, 3vw, 1.2rem); color: #aaa; margin-bottom: 30px; }

.unit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 500px; margin-bottom: 24px; }
.unit-btn {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  border: none; border-radius: 14px; padding: 18px 8px; font-size: 1rem;
  font-weight: 700; color: white; cursor: pointer;
  box-shadow: 0 4px 15px rgba(231,76,60,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  touch-action: manipulation;
}
.unit-btn:active { transform: scale(0.95); }
.unit-btn.all-btn {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, #f39c12, #e67e22);
  box-shadow: 0 4px 15px rgba(243,156,18,0.4);
  font-size: 1.1rem;
}

.dir-toggle {
  display: flex; gap: 8px; margin-bottom: 20px;
}
.dir-btn {
  background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
  border-radius: 10px; padding: 10px 16px; color: white; cursor: pointer;
  font-size: 0.9rem; font-weight: 600; transition: all 0.2s;
  touch-action: manipulation;
}
.dir-btn.active {
  background: #3498db; border-color: #3498db;
  box-shadow: 0 0 15px rgba(52,152,219,0.5);
}

.milestones-preview {
  background: rgba(255,255,255,0.05); border-radius: 14px;
  padding: 16px 20px; max-width: 500px; width: 100%;
  font-size: 0.85rem; color: #ccc; text-align: left;
}
.milestones-preview h3 { color: #f39c12; margin-bottom: 10px; }
.milestone-item { padding: 4px 0; }

/* ── GAME SCREEN ── */
#game { display: none; padding: 16px; min-height: 100vh; }

.hud {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(0,0,0,0.3); border-radius: 14px; padding: 12px 16px;
  margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.hud-item { text-align: center; }
.hud-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
.hud-value { font-size: 1.3rem; font-weight: 800; color: #f39c12; }
.hud-streak { color: #e74c3c; }

.track-bar {
  background: rgba(255,255,255,0.1); border-radius: 100px;
  height: 18px; margin-bottom: 20px; overflow: hidden; position: relative;
}
.track-fill {
  height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71);
  border-radius: 100px; transition: width 0.4s ease;
  min-width: 0%;
}
.car { position: absolute; top: -3px; font-size: 22px; transition: left 0.4s ease; }

.question-card {
  background: rgba(255,255,255,0.08); border-radius: 20px;
  padding: 28px 24px; margin-bottom: 20px; text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
}
.question-unit { font-size: 0.8rem; color: #aaa; margin-bottom: 8px; }
.question-dir  { font-size: 0.8rem; color: #3498db; margin-bottom: 16px; }
.question-word { font-size: clamp(1.4rem, 6vw, 2.2rem); font-weight: 800; color: white; line-height: 1.3; }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.ans-btn {
  background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
  border: 2px solid rgba(255,255,255,0.2); border-radius: 16px;
  padding: 18px 12px; font-size: clamp(0.85rem, 3vw, 1.05rem); font-weight: 600;
  color: white; cursor: pointer; transition: all 0.2s; line-height: 1.4;
  touch-action: manipulation; min-height: 64px;
}
.ans-btn:active { transform: scale(0.97); }
.ans-btn.correct { background: linear-gradient(135deg, #27ae60, #2ecc71); border-color: #27ae60; transform: scale(1.03); }
.ans-btn.wrong   { background: linear-gradient(135deg, #c0392b, #e74c3c); border-color: #c0392b; }
.ans-btn.reveal  { background: linear-gradient(135deg, #27ae60, #2ecc71); border-color: #27ae60; }

.feedback {
  text-align: center; font-size: 1.1rem; font-weight: 700;
  min-height: 30px; margin-bottom: 10px;
}
.feedback.correct-fb { color: #2ecc71; }
.feedback.wrong-fb   { color: #e74c3c; }

#btn-back {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px; padding: 10px 20px; color: white; cursor: pointer;
  font-size: 0.9rem; margin-top: 8px; touch-action: manipulation;
}

/* ── MILESTONE POPUP ── */
#milestone-popup {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 100;
  align-items: center; justify-content: center;
  flex-direction: column; text-align: center; padding: 30px;
}
#milestone-popup.show { display: flex; }
#milestone-popup h2 { font-size: clamp(1.8rem, 8vw, 3rem); margin-bottom: 10px; }
#milestone-popup p  { font-size: clamp(1rem, 4vw, 1.4rem); color: #f39c12; margin-bottom: 8px; }
#milestone-popup .reward { font-size: clamp(1.2rem, 5vw, 1.8rem); background: rgba(243,156,18,0.2); border-radius: 14px; padding: 14px 20px; margin: 16px 0; border: 2px solid #f39c12; }
#btn-continue {
  background: linear-gradient(135deg, #27ae60, #2ecc71);
  border: none; border-radius: 14px; padding: 16px 36px;
  font-size: 1.2rem; font-weight: 800; color: white; cursor: pointer;
  margin-top: 16px; touch-action: manipulation;
}

/* confetti */
.confetti-piece {
  position: fixed; width: 10px; height: 10px; border-radius: 2px;
  animation: confetti-fall 2.5s ease-in forwards;
  z-index: 200;
}
@keyframes confetti-fall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
</style>
</head>

<!-- HOME -->
<div id="home">
  <h1>🏎️ Vocab Racer</h1>
  <p>Blue Line 2 · 527 Vokabeln · Units 1–6</p>

  <div class="dir-toggle">
    <button class="dir-btn active" onclick="setDir('de2en')">DE → EN</button>
    <button class="dir-btn" onclick="setDir('en2de')">EN → DE</button>
    <button class="dir-btn" onclick="setDir('mix')">Mix 🎲</button>
  </div>

  <div class="unit-grid">
    <button class="unit-btn" onclick="startGame('Unit 1')">Unit 1</button>
    <button class="unit-btn" onclick="startGame('Unit 2')">Unit 2</button>
    <button class="unit-btn" onclick="startGame('Unit 3')">Unit 3</button>
    <button class="unit-btn" onclick="startGame('Unit 4')">Unit 4</button>
    <button class="unit-btn" onclick="startGame('Unit 5')">Unit 5</button>
    <button class="unit-btn" onclick="startGame('Unit 6')">Unit 6</button>
    <button class="unit-btn all-btn" onclick="startGame('Alle Units')">🏆 Alle Units</button>
  </div>

  <div class="milestones-preview">
    <h3>🎁 Belohnungen</h3>
    <div class="milestone-item">✅ 10 richtig → 🐻 Gummibärchen</div>
    <div class="milestone-item">✅ 25 richtig → 🎮 30 Min Tablet</div>
    <div class="milestone-item">✅ 50 richtig → 🍕 Wunschessen</div>
    <div class="milestone-item">✅ 100 richtig → 🏆 Großer Preis!</div>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div class="hud">
    <div class="hud-item">
      <div class="hud-label">✅ Richtig</div>
      <div class="hud-value" id="score-display">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">🔥 Streak</div>
      <div class="hud-value hud-streak" id="streak-display">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">📚 Unit</div>
      <div class="hud-value" id="unit-display" style="font-size:0.95rem">–</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">🎯 Gesamt</div>
      <div class="hud-value" id="total-display">0</div>
    </div>
  </div>

  <div class="track-bar">
    <div class="track-fill" id="track-fill"></div>
    <div class="car" id="car-emoji">🏎️</div>
  </div>

  <div class="question-card">
    <div class="question-unit" id="q-unit"></div>
    <div class="question-dir" id="q-dir"></div>
    <div class="question-word" id="q-word">Laden…</div>
  </div>

  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
  <button id="btn-back" onclick="goHome()">← Zurück</button>
</div>

<!-- MILESTONE POPUP -->
<div id="milestone-popup">
  <div style="font-size:3.5rem" id="ms-emoji">🎉</div>
  <h2 id="ms-title">Super!</h2>
  <p id="ms-score"></p>
  <div class="reward" id="ms-reward"></div>
  <button id="btn-continue" onclick="closeMilestone()">Weiter! 🏎️</button>
</div>

const MILESTONES = [
  { at:10,  emoji:"🐻", title:"Toll gemacht!",     reward:"🐻 Gummibärchen verdient!" },
  { at:25,  emoji:"🎮", title:"Mega!",             reward:"🎮 30 Minuten Tablet spielen!" },
  { at:50,  emoji:"🍕", title:"Unglaublich!",      reward:"🍕 Wunschessen aussuchen!" },
  { at:100, emoji:"🏆", title:"CHAMPION!",         reward:"🏆 Großer Preis! Du rockst!" },
];

let pool=[], direction='de2en', score=0, streak=0, totalAnswered=0, currentUnit='', shownMilestones=new Set();
let currentQ=null, answered=false;

function setDir(d) {
  direction=d;
  document.querySelectorAll('.dir-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}

function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function startGame(unit) {
  currentUnit=unit;
  if(unit==='Alle Units') pool=shuffle(Object.values(VOCAB).flat().map(v=>({...v,_unit:Object.keys(VOCAB).find(u=>VOCAB[u].includes(v))||''})));
  else pool=shuffle(VOCAB[unit].map(v=>({...v,_unit:unit})));
  score=0; streak=0; totalAnswered=0; shownMilestones=new Set();
  document.getElementById('home').style.display='none';
  document.getElementById('game').style.display='block';
  document.getElementById('unit-display').textContent=unit==='Alle Units'?'Alle':unit;
  updateHUD(); nextQuestion();
}

function updateHUD() {
  document.getElementById('score-display').textContent=score;
  document.getElementById('streak-display').textContent=streak;
  document.getElementById('total-display').textContent=totalAnswered;
  const pct=Math.min((score%10)/10*100,100);
  document.getElementById('track-fill').style.width=pct+'%';
  document.getElementById('car-emoji').style.left=Math.max(0,pct-5)+'%';
}

function nextQuestion() {
  if(pool.length===0) pool=shuffle(Object.values(currentUnit==='Alle Units'?Object.assign({},...Object.keys(VOCAB).map(u=>({[u]:VOCAB[u]}))) :({[currentUnit]:VOCAB[currentUnit]})).flat?.()||
    (currentUnit==='Alle Units'?Object.values(VOCAB).flat():VOCAB[currentUnit]).map(v=>({...v})));
  currentQ=pool.pop();
  answered=false;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';

  // Determine display direction
  let askDir=direction;
  if(direction==='mix') askDir=Math.random()<0.5?'de2en':'en2de';

  const qWord  = askDir==='de2en'?currentQ.de:currentQ.en;
  const answer = askDir==='de2en'?currentQ.en:currentQ.de;
  const qLabel = askDir==='de2en'?'🇩🇪 Deutsch → Englisch':'🇬🇧 Englisch → Deutsch';

  currentQ._answer=answer; currentQ._dir=askDir;
  document.getElementById('q-unit').textContent=currentQ._unit||currentUnit;
  document.getElementById('q-dir').textContent=qLabel;
  document.getElementById('q-word').textContent=qWord;

  // 3 wrong options from pool of same unit or all
  const allWords=(currentUnit==='Alle Units'?Object.values(VOCAB).flat():VOCAB[currentUnit]||[]);
  let wrong=shuffle(allWords.filter(v=>(askDir==='de2en'?v.en:v.de)!==answer))
             .slice(0,3).map(v=>askDir==='de2en'?v.en:v.de);
  let opts=shuffle([answer,...wrong]);

  const cont=document.getElementById('answers');
  cont.innerHTML='';
  opts.forEach(opt=>{
    const b=document.createElement('button');
    b.className='ans-btn'; b.textContent=opt;
    b.onclick=()=>checkAnswer(b,opt,answer);
    cont.appendChild(b);
  });
}

function checkAnswer(btn, chosen, correct) {
  if(answered) return;
  answered=true;
  totalAnswered++;
  document.querySelectorAll('.ans-btn').forEach(b=>{
    if(b.textContent===correct) b.classList.add('reveal');
  });
  if(chosen===correct) {
    score++; streak++;
    btn.classList.add('correct');
    document.getElementById('feedback').textContent='✅ Richtig! '+( streak>2?'🔥 '+streak+'er Streak!':'');
    document.getElementById('feedback').className='feedback correct-fb';
    updateHUD();
    checkMilestone();
    setTimeout(nextQuestion, 1100);
  } else {
    streak=0;
    btn.classList.add('wrong');
    document.getElementById('feedback').textContent='❌ Falsch! Richtig: '+correct;
    document.getElementById('feedback').className='feedback wrong-fb';
    updateHUD();
    setTimeout(nextQuestion, 1800);
  }
}

function checkMilestone() {
  MILESTONES.forEach(m=>{
    if(score===m.at && !shownMilestones.has(m.at)) {
      shownMilestones.add(m.at);
      showMilestone(m);
    }
  });
}

function showMilestone(m) {
  launchConfetti();
  document.getElementById('ms-emoji').textContent=m.emoji;
  document.getElementById('ms-title').textContent=m.title;
  document.getElementById('ms-score').textContent=score+' Vokabeln richtig!';
  document.getElementById('ms-reward').textContent=m.reward;
  document.getElementById('milestone-popup').classList.add('show');
}

function closeMilestone() {
  document.getElementById('milestone-popup').classList.remove('show');
  nextQuestion();
}

function goHome() {
  document.getElementById('game').style.display='none';
  document.getElementById('home').style.display='flex';
}

function launchConfetti() {
  const colors=['#f39c12','#e74c3c','#2ecc71','#3498db','#9b59b6','#1abc9c'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.left=Math.random()*100+'vw';
    el.style.top='-20px';
    el.style.background=colors[Math.random()*colors.length|0];
    el.style.animationDelay=(Math.random()*1)+'s';
    el.style.transform='rotate('+(Math.random()*360)+'deg)';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
}
